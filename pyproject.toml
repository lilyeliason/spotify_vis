[project]
name = "spotify-viz"
version = "0.1.0"
description = "Summaries and charts from Spotify Extended Streaming History"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "pyarrow>=18.0",
    "statsmodels>=0.14.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_viz"]
